name: Test missing tokens error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create README without chess tokens
        run: |
          cat > README.md << 'EOF'
          # My Profile

          This README has no chess section tokens.
          EOF

      - id: action
        uses: .
        with:
          CHESS_USERNAME: hikaru
          GAMES_SIZE: "5"
          IS_DEBUG: "true"
        continue-on-error: true

      - name: Assert action failed due to missing tokens
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: Expected action to fail when START_TOKEN is missing, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: Action correctly failed when chess section tokens are missing"
