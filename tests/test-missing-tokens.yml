name: Test missing tokens error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Reset fixture file to state without tokens
        run: |
          printf '# Chess Stats Test\n\nThis README does not have the required chess stats tokens.\n' \
            > "$GITHUB_WORKSPACE/tests/fixtures/README-no-tokens.md"
          echo "=== Fixture file prepared (no tokens) ==="
          cat "$GITHUB_WORKSPACE/tests/fixtures/README-no-tokens.md"

      - id: action
        uses: .
        with:
          CHESS_USERNAME: hikaru
          GAMES_SIZE: "3"
          FILE_NAME: "tests/fixtures/README-no-tokens.md"
        env:
          INPUT_IS_DEBUG: "true"
        continue-on-error: true

      - name: Assert action failed due to missing tokens
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when START_TOKEN is missing, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when tokens are missing"
